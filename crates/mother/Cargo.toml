[package]
name = "mother-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "motherctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.11", default-features = false, features = ["client", "transport-child-process"] }
