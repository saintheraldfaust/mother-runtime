  "Task creation/checkpoint/transition audit failures roll back all state and retry keys",
  "Schema-2 handoff bytes and retry payloads survive schema-3 migration; failed migration rolls back",
  "Byte-bounded context pages recover all records without cursor gaps",
  "Persona revisions, status changes, immutable history and duplicate-name rejection",
  "Asserted task operations use current persona revision, scope and capability",
  "Stale and revoked persona policy rejects independent MCP clients while history remains readable",
  "Schema-3 upgrade preserves tasks and adds persona tables",
  "Schema-4 upgrade preserves personas and adds GitHub identity tables",
  "Read-only gh verification uses an isolated profile and removes token environment variables",
  "GitHub identities require an active github.read persona and one active identity per persona",
  "Identity revocation is revisioned, immediately visible to MCP clients, and history remains immutable",
  "Worker eligibility excludes incomplete dependencies and unexpired leases",
  "Task-level and global worker lease bounds reject duplicate or excess acquisition",
  "Heartbeats extend expiry and stale worker revisions conflict",
  "Deterministic mock checkpoints leave files unchanged and cannot complete tasks",
  "Running supervised processes block expiry requeue and retain expired evidence",
  "Owner-run mock process isolates its checkout, writes one artifact, and never completes the task",
