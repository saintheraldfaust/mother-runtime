coverage = [
  "Eight concurrent independent CLI writers share one runtime",
  "Project/context state and retry responses survive actual process kill/restart",
  "State, revision, retry key, and event roll back on injected transaction failure",
  "Idempotent replay, payload conflicts, stale revision rejection, pagination",
  "Single-writer lock, graceful termination, stale socket recovery",
  "Malformed and oversized IPC, protocol/config/schema validation",
  "Private directory/socket checks, symlink rejection, append-only events",
  "doctor reports absent state without initializing it",
  "Two real SDK MCP clients launch separate stdio bridges sharing live CLI/runtime state",
  "MCP schemas, tools, resources, structured errors, pagination, and required retry keys",
  "Connected MCP clients recover after runtime kill/restart; new sessions retrieve persisted revision",
  "MCP bridge never initializes state and fatal initialization errors leave stdout clean",
  "Schema-1 migration preserves records and retry responses; failed migration DDL rolls back",
  "Scoped decision supersession excludes historical records from live context and rolls back on failed audit",
  "Bounded snapshots with escaped text, immutable package bytes, SHA-256 verification and corruption detection",
  "Another MCP client recovers handoff claims/failures/blockers/provenance after runtime restart",
  "Concurrent handoff resume commits one claim, rejects stale state, and replays its exact key after restart",
  "Handoff creation and claim audit failures roll back all state",
  "Host-tracked tasks and failed checkpoints recover through a different MCP client after restart",
  "Competing task revisions commit one transition; exact completion replay works across CLI/MCP after restart",
  "Completion rejects absent/stale/mismatched/modified file evidence and review-required tasks",
  "Cross-project dependencies and task-focused handoffs reject wrong scope",
  "Repository path traversal, symlink/hardlink/FIFO rejection, file and aggregate read caps",
  "Task creation/checkpoint/transition audit failures roll back all state and retry keys",
  "Schema-2 handoff bytes and retry payloads survive schema-3 migration; failed migration rolls back",
  "Byte-bounded context pages recover all records without cursor gaps",
  "Persona revisions, status changes, immutable history and duplicate-name rejection",
  "Asserted task operations use current persona revision, scope and capability",
  "Stale and revoked persona policy rejects independent MCP clients while history remains readable",
  "Schema-3 upgrade preserves tasks and adds persona tables",
]
